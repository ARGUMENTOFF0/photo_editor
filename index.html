<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль пользователя</title>
  <!-- 1. Подключаем внешние стили CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Главный контейнер карточки -->
  <div class="profile-card">
    
    <!-- Заголовок с ID для индивидуального обращения -->
    <h2 id="profile-title">Редактирование профиля</h2>

    <!-- Текущий аватар -->
    <div class="avatar-container">
      <img id="avatar-preview" src="https://via.placeholder.com/120" alt="Аватар пользователя">
    </div>

    <!-- Форма отправки данных на сервер -->
    <!-- enctype="multipart/form-data" обязателен для файлов! -->
    <form action="/update-profile" method="POST" enctype="multipart/form-data" class="profile-form">
      
      <!-- Поле 1: Имя -->
      <div class="form-group">
        <label for="username">Имя пользователя:</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="Введите имя" 
          class="form-control" 
          required
        >
      </div>

      <!-- Поле 2: Выбор аватарки -->
      <div class="form-group">
        <label for="avatar-input">Загрузить новый аватар:</label>
        <input 
          type="file" 
          id="avatar-input" 
          name="avatar" 
          accept="image/*" 
          class="file-input"
        >
      </div>

      <!-- Кнопка отправки -->
      <button type="submit" class="btn btn-primary">Сохранить изменения</button>
      
    </form>

  </div>

  <!-- 2. Подключаем JavaScript перед закрывающим </body> -->
  <script src="script.js"></script>
</body>
</html>
